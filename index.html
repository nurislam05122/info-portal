<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DashStack — Sales &amp; Deals Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>


  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --ds-bg:            #0f1224;
    --ds-panel:         #171b30;
    --ds-panel-2:       #1b2038;
    --ds-border:        #262c48;
    --ds-border-soft:   rgba(255,255,255,0.06);

    --ds-text:          #f4f5fb;
    --ds-text-dim:      #9096b4;
    --ds-text-mute:     #6a7093;

    --ds-blue:          #5b6df6;
    --ds-blue-soft:     rgba(91,109,246,0.14);
    --ds-purple:        #7c6bf0;
    --ds-amber:         #f2b90c;
    --ds-green:         #22c55e;
    --ds-green-soft:    rgba(34,197,94,0.15);
    --ds-orange:        #ef7d4f;
    --ds-red:           #f24c6a;
    --ds-red-soft:      rgba(242,76,106,0.14);
    --ds-blue-soft2:    rgba(91,109,246,0.16);
    --ds-amber-soft:    rgba(242,185,12,0.15);

    --ds-radius-lg: 18px;
    --ds-radius-md: 14px;
    --ds-radius-sm: 10px;
    --ds-radius-pill: 999px;

    --ds-shadow: 0 10px 30px rgba(4,6,20,0.35);
    --ds-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *,*::before,*::after{ box-sizing: inherit; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body{
    margin:0;
    background: var(--ds-bg);
    color: var(--ds-text);
    font-family: var(--ds-font);
    -webkit-font-smoothing: antialiased;
  }

  .ds-page{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  .ds-page__title{
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 4px 0 20px;
  }

  a{ color: inherit; }
  button{ font-family: inherit; }


  .ds-page :focus-visible{
    outline: 2px solid var(--ds-blue);
    outline-offset: 2px;
    border-radius: 6px;
  }



  .ds-stats{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 22px;
  }

  .ds-card{
    background: var(--ds-panel);
    border: 1px solid var(--ds-border-soft);
    border-radius: var(--ds-radius-lg);
    padding: 18px 20px;
    box-shadow: var(--ds-shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .ds-card:hover{
    transform: translateY(-3px);
    box-shadow: 0 16px 34px rgba(4,6,20,0.45);
  }

  .ds-card__top{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom: 14px;
  }
  .ds-card__label{
    margin:0; font-size: 13.5px; color: var(--ds-text-dim); font-weight: 500;
  }
  .ds-card__icon{
    width:44px; height:44px; border-radius: 13px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    color:#fff;
  }
  .ds-card__icon svg{ width:21px; height:21px; }

  .ds-card__value{
    margin:0 0 10px; font-size: 26px; font-weight: 800; letter-spacing:-0.01em;
  }

  .ds-card__trend{
    margin:0; display:flex; align-items:center; gap:6px;
    font-size: 13px; font-weight: 600;
  }
  .ds-card__trend svg{ width:14px; height:14px; flex-shrink:0; }
  .ds-card__trend--up{ color: var(--ds-green); }
  .ds-card__trend--down{ color: var(--ds-red); }
  .ds-card__trend-text{ color: var(--ds-text-mute); font-weight: 500; }



  .ds-panel{
    background: var(--ds-panel);
    border: 1px solid var(--ds-border-soft);
    border-radius: var(--ds-radius-lg);
    box-shadow: var(--ds-shadow);
    padding: 22px 22px 20px;
    margin-bottom: 22px;
  }

  .ds-panel__header{
    display:flex; align-items:center; justify-content:space-between;
    gap: 14px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .ds-panel__title{ margin:0; font-size: 17px; font-weight: 700; }

  .ds-panel__controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

 

  .ds-dropdown{ position: relative; }
  .ds-dropdown__trigger{
    display:flex; align-items:center; gap:8px;
    background: var(--ds-panel-2);
    border: 1px solid var(--ds-border);
    color: var(--ds-text);
    font-size: 13.5px; font-weight: 500;
    padding: 8px 12px;
    border-radius: var(--ds-radius-sm);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
    white-space: nowrap;
  }
  .ds-dropdown__trigger:hover{ border-color:#3a4066; background:#1f2440; }
  .ds-dropdown__trigger svg{ width:14px; height:14px; color: var(--ds-text-dim); transition: transform .15s ease; }
  .ds-dropdown.is-open .ds-dropdown__trigger svg{ transform: rotate(180deg); }

  .ds-dropdown__menu{
    list-style:none; margin:0; padding:6px;
    position:absolute; right:0; top: calc(100% + 6px);
    min-width: 168px; max-height: 260px; overflow-y:auto;
    background: #1c2140;
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-sm);
    box-shadow: 0 18px 40px rgba(0,0,0,0.5);
    z-index: 20;
    display:none;
  }
  .ds-dropdown.is-open .ds-dropdown__menu{ display:block; }
  .ds-dropdown__menu li{
    padding: 8px 10px; border-radius: 8px; font-size: 13.5px;
    color: var(--ds-text-dim); cursor:pointer;
  }
  .ds-dropdown__menu li:hover,
  .ds-dropdown__menu li.is-active{ background: var(--ds-blue-soft); color: var(--ds-text); }




  .ds-chart-wrap{
    position: relative;
    height: 300px;
  }
  .ds-chart-wrap canvas{
    width:100%; height:100%; display:block; cursor: crosshair;
  }

  .ds-tooltip{
    position:absolute;
    transform: translate(-50%,-100%) translateY(-10px);
    background: var(--ds-blue);
    color:#fff;
    font-size: 12.5px; font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    pointer-events:none;
    box-shadow: 0 8px 18px rgba(91,109,246,0.45);
  }
  .ds-tooltip::after{
    content:"";
    position:absolute; left:50%; top:100%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ds-blue);
  }
  .ds-tooltip[hidden]{ display:none; }


  .ds-search{
    display:flex; align-items:center; gap:8px;
    background: var(--ds-panel-2);
    border: 1px solid var(--ds-border);
    border-radius: var(--ds-radius-sm);
    padding: 8px 12px;
    min-width: 220px;
  }
  .ds-search svg{ width:15px; height:15px; color: var(--ds-text-mute); flex-shrink:0; }
  .ds-search input{
    border:0; background:transparent; outline:0; color: var(--ds-text);
    font-size: 13.5px; width:100%; font-family: inherit;
  }
  .ds-search input::placeholder{ color: var(--ds-text-mute); }

  .ds-table-scroll{
    overflow-x: auto;
    margin: 0 -4px;
    padding: 0 4px;
  }

  table.ds-table{
    width:100%; border-collapse: collapse; min-width: 720px;
  }
  .ds-table thead th{
    text-align:left; font-size: 12.5px; text-transform: none;
    color: var(--ds-text-mute); font-weight: 600;
    padding: 0 14px 12px;
    border-bottom: 1px solid var(--ds-border-soft);
    user-select: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .ds-table thead th:hover{ color: var(--ds-text-dim); }
  .ds-table thead th .ds-sort-icon{
    display:inline-flex; margin-left:5px; opacity:.5; vertical-align:middle;
  }
  .ds-table thead th[aria-sort="ascending"] .ds-sort-icon,
  .ds-table thead th[aria-sort="descending"] .ds-sort-icon{ opacity:1; color: var(--ds-blue); }
  .ds-table thead th[aria-sort="ascending"] .ds-sort-icon{ transform: rotate(180deg); }

  .ds-table tbody td{
    padding: 13px 14px;
    font-size: 13.5px;
    border-bottom: 1px solid var(--ds-border-soft);
    color: var(--ds-text-dim);
    vertical-align: middle;
  }
  .ds-table tbody tr{ transition: background .12s ease; }
  .ds-table tbody tr:hover{ background: rgba(255,255,255,0.025); }
  .ds-table tbody tr:last-child td{ border-bottom: none; }

  .ds-product-cell{ display:flex; align-items:center; gap:10px; }
  .ds-avatar{
    width:34px; height:34px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight: 700; color:#fff; flex-shrink:0;
  }
  .ds-product-name{ color: var(--ds-text); font-weight: 600; font-size: 13.5px; }

  .ds-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding: 5px 12px; border-radius: var(--ds-radius-pill);
    font-size: 12.5px; font-weight: 700;
  }
  .ds-badge::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .ds-badge--delivered{ background: var(--ds-green-soft); color: var(--ds-green); }
  .ds-badge--pending{ background: var(--ds-amber-soft); color: var(--ds-amber); }
  .ds-badge--cancelled{ background: var(--ds-red-soft); color: var(--ds-red); }
  .ds-badge--processing{ background: var(--ds-blue-soft2); color: var(--ds-blue); }

  .ds-empty{
    padding: 40px 12px; text-align:center; color: var(--ds-text-mute); font-size: 13.5px;
  }

  .ds-pagination{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 16px; gap: 10px; flex-wrap: wrap;
  }
  .ds-pagination__info{ font-size: 12.5px; color: var(--ds-text-mute); }
  .ds-pagination__controls{ display:flex; align-items:center; gap:6px; }
  .ds-page-btn{
    min-width: 30px; height: 30px; padding: 0 8px;
    border-radius: 8px; border: 1px solid var(--ds-border);
    background: var(--ds-panel-2); color: var(--ds-text-dim);
    font-size: 12.5px; font-weight: 600; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .ds-page-btn:hover:not(:disabled){ background:#1f2440; color:var(--ds-text); border-color:#3a4066; }
  .ds-page-btn.is-active{ background: var(--ds-blue); color:#fff; border-color: var(--ds-blue); }
  .ds-page-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .ds-page-btn svg{ width:14px; height:14px; }


  @media (max-width: 980px){
    .ds-stats{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px){
    .ds-page{ padding: 20px 14px 48px; }
    .ds-stats{ grid-template-columns: 1fr; }
    .ds-panel{ padding: 18px 16px 16px; }
    .ds-panel__controls{ width:100%; }
    .ds-search{ flex:1; min-width: 0; }
    .ds-chart-wrap{ height: 240px; }
  }
</style>
</head>
<body>

<div class="ds-page">
  <h1 class="ds-page__title">Dashboard</h1>


  <section class="ds-stats" id="dsStats" aria-label="Ключевые показатели"></section>

  <section class="ds-panel" aria-label="Sales Details">
    <div class="ds-panel__header">
      <h2 class="ds-panel__title">Sales Details</h2>
      <div class="ds-panel__controls">
        <div class="ds-dropdown" id="salesMonthDropdown">
          <button class="ds-dropdown__trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span data-dropdown-label>October</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <ul class="ds-dropdown__menu" role="listbox" aria-label="Выбор месяца"></ul>
        </div>
      </div>
    </div>

    <div class="ds-chart-wrap" id="salesChartWrap">
      <canvas id="salesChart" role="img" aria-label="График продаж по объёму заказов"></canvas>
      <div class="ds-tooltip" id="salesTooltip" hidden></div>
    </div>
  </section>

  
  <section class="ds-panel" aria-label="Deals Details">
    <div class="ds-panel__header">
      <h2 class="ds-panel__title">Deals Details</h2>
      <div class="ds-panel__controls">
        <label class="ds-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="dealsSearch" placeholder="Поиск по товару или локации" aria-label="Поиск по сделкам">
        </label>
        <div class="ds-dropdown" id="statusDropdown">
          <button class="ds-dropdown__trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span data-dropdown-label>All Status</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <ul class="ds-dropdown__menu" role="listbox" aria-label="Фильтр по статусу"></ul>
        </div>
        <div class="ds-dropdown" id="dealsMonthDropdown">
          <button class="ds-dropdown__trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span data-dropdown-label>All Months</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <ul class="ds-dropdown__menu" role="listbox" aria-label="Фильтр по месяцу"></ul>
        </div>
      </div>
    </div>

    <div class="ds-table-scroll">
      <table class="ds-table">
        <thead>
          <tr>
            <th data-sort="product">Product Name<span class="ds-sort-icon">▾</span></th>
            <th data-sort="location">Location<span class="ds-sort-icon">▾</span></th>
            <th data-sort="datetime">Date - Time<span class="ds-sort-icon">▾</span></th>
            <th data-sort="piece">Piece<span class="ds-sort-icon">▾</span></th>
            <th data-sort="amount">Amount<span class="ds-sort-icon">▾</span></th>
            <th data-sort="status">Status<span class="ds-sort-icon">▾</span></th>
          </tr>
        </thead>
        <tbody id="dealsBody"></tbody>
      </table>
    </div>
    <p class="ds-empty" id="dealsEmpty" hidden>Ничего не найдено — попробуйте изменить поиск или фильтры.</p>

    <div class="ds-pagination">
      <span class="ds-pagination__info" id="dealsInfo"></span>
      <div class="ds-pagination__controls" id="dealsPageControls"></div>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";


  const ICONS = {
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="10" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
    box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5Z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>',
    trending: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"></polyline><polyline points="14 6 21 6 21 13"></polyline></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>',
    arrowUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="6 11 12 5 18 11"></polyline></svg>',
    arrowDown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="18 13 12 19 6 13"></polyline></svg>',
    chevLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
    chevRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>'
  };

  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const MONTHS_RU = {January:"Январь",February:"Февраль",March:"Март",April:"Апрель",May:"Май",June:"Июнь",July:"Июль",August:"Август",September:"Сентябрь",October:"Октябрь",November:"Ноябрь",December:"Декабрь"};


  const STATS = [
    { label:"Total User",    value:"40,689",  icon:"users",     bg:"var(--ds-purple)", trend:"up",   trendVal:"8.5%", text:"Up from yesterday" },
    { label:"Total Order",   value:"10,293",  icon:"box",       bg:"var(--ds-amber)",  trend:"up",   trendVal:"1.3%", text:"from past week" },
    { label:"Total Sales",   value:"$89,000", icon:"trending",  bg:"var(--ds-green)",  trend:"down", trendVal:"4.3%", text:"Down from yesterday" },
    { label:"Total Pending", value:"2,040",   icon:"refresh",   bg:"var(--ds-orange)", trend:"up",   trendVal:"1.8%", text:"Up from yesterday" }
  ];

  function renderStats(){
    const root = document.getElementById("dsStats");
    root.innerHTML = STATS.map(s => `
      <div class="ds-card">
        <div class="ds-card__top">
          <p class="ds-card__label">${s.label}</p>
          <div class="ds-card__icon" style="background:${s.bg}">${ICONS[s.icon]}</div>
        </div>
        <p class="ds-card__value">${s.value}</p>
        <p class="ds-card__trend ds-card__trend--${s.trend}">
          ${s.trend === "up" ? ICONS.arrowUp : ICONS.arrowDown}
          ${s.trendVal} <span class="ds-card__trend-text">${s.text}</span>
        </p>
      </div>
    `).join("");
  }

  
  function createDropdown(rootEl, { options, initial, onSelect, renderLabel }){
    const trigger = rootEl.querySelector(".ds-dropdown__trigger");
    const label   = trigger.querySelector("[data-dropdown-label]");
    const menu    = rootEl.querySelector(".ds-dropdown__menu");

    menu.innerHTML = options.map(o =>
      `<li role="option" data-value="${o}" class="${o === initial ? "is-active" : ""}">${renderLabel ? renderLabel(o) : o}</li>`
    ).join("");
    label.textContent = renderLabel ? renderLabel(initial) : initial;

    function setOpen(open){
      rootEl.classList.toggle("is-open", open);
      trigger.setAttribute("aria-expanded", String(open));
    }

    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const willOpen = !rootEl.classList.contains("is-open");
      document.querySelectorAll(".ds-dropdown.is-open").forEach(d => d !== rootEl && d.classList.remove("is-open"));
      setOpen(willOpen);
    });

    menu.addEventListener("click", (e) => {
      const li = e.target.closest("li");
      if(!li) return;
      menu.querySelectorAll("li").forEach(el => el.classList.remove("is-active"));
      li.classList.add("is-active");
      label.textContent = li.textContent;
      setOpen(false);
      onSelect(li.dataset.value);
    });

    document.addEventListener("click", () => setOpen(false));
    rootEl.addEventListener("keydown", (e) => { if(e.key === "Escape") setOpen(false); });

    return {
      setLabel(text){ label.textContent = text; }
    };
  }

  const X_LABELS = ["5k","10k","15k","20k","25k","30k","35k","40k","45k","50k","55k","60k"];

 
  const OCTOBER_DATA = [20, 55.2, 44.1, 97, 47.3, 40.5, 22.4, 46.8, 82.1, 63.4, 51.9, 60.2];

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function monthData(monthIndex){
    if(monthIndex === 9) return OCTOBER_DATA.slice(); // October, explicit reference dataset
    const rand = mulberry32(monthIndex * 97 + 13);
    const data = [];
    let base = 32 + rand() * 18;
    for(let i = 0; i < X_LABELS.length; i++){
      base += (rand() - 0.47) * 22;
      base = Math.min(96, Math.max(16, base));
      data.push(Math.round(base * 100) / 100);
    }
    return data;
  }

  const salesChart = (function(){
    const canvas  = document.getElementById("salesChart");
    const wrap    = document.getElementById("salesChartWrap");
    const tooltip = document.getElementById("salesTooltip");
    const ctx = canvas.getContext("2d");

    let currentMonth = 9; 
    let data = monthData(currentMonth);
    let hoverIndex = null;
    let geom = null; 

    function resize(){
      const rect = wrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.max(1, Math.round(rect.width  * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      canvas.style.width  = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw(){
      const width  = wrap.clientWidth;
      const height = wrap.clientHeight;
      ctx.clearRect(0, 0, width, height);

      const padding = { left: 34, right: 10, top: 20, bottom: 26 };
      const plotW = width  - padding.left - padding.right;
      const plotH = height - padding.top  - padding.bottom;
      const yMin = 10, yMax = 100;

      const xPos = (i) => padding.left + (i / (data.length - 1)) * plotW;
      const yPos = (v) => padding.top + (1 - (v - yMin) / (yMax - yMin)) * plotH;

   
      ctx.font = "11px Inter, sans-serif";
      ctx.fillStyle = "#6a7093";
      ctx.textBaseline = "middle";
      [20, 40, 60, 80, 100].forEach((v) => {
        const y = yPos(v);
        ctx.strokeStyle = "rgba(255,255,255,0.055)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();
        ctx.textAlign = "right";
        ctx.fillText(v + "%", padding.left - 8, y);
      });

    
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      X_LABELS.forEach((lbl, i) => {
        ctx.fillText(lbl, xPos(i), height - padding.bottom + 8);
      });

    
      const gradient = ctx.createLinearGradient(0, padding.top, 0, height - padding.bottom);
      gradient.addColorStop(0, "rgba(91,109,246,0.38)");
      gradient.addColorStop(1, "rgba(91,109,246,0)");

      ctx.beginPath();
      data.forEach((v, i) => {
        const x = xPos(i), y = yPos(v);
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.lineTo(xPos(data.length - 1), height - padding.bottom);
      ctx.lineTo(xPos(0), height - padding.bottom);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

    
      ctx.beginPath();
      data.forEach((v, i) => {
        const x = xPos(i), y = yPos(v);
        if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "#5b6df6";
      ctx.lineWidth = 2.25;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();

     
      let peakIndex = 0;
      data.forEach((v, i) => { if(v > data[peakIndex]) peakIndex = i; });

   
      data.forEach((v, i) => {
        const x = xPos(i), y = yPos(v);
        const isPeak  = i === peakIndex && hoverIndex === null;
        const isHover = i === hoverIndex;

        if(isHover){
          ctx.beginPath();
          ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#5b6df6";
          ctx.fill();
        } else if(isPeak){
          ctx.beginPath();
          ctx.arc(x, y, 5.5, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x, y, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = "#f2b90c";
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(x, y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = "#5b6df6";
          ctx.fill();
        }
      });

      geom = { xPos, yPos, peakIndex, width, height };
      const activeIndex = hoverIndex === null ? peakIndex : hoverIndex;
      showTooltip(activeIndex);
    }

    function showTooltip(index){
      if(!geom) return;
      const v = data[index];
      tooltip.textContent = v.toFixed(2) + "%";
      tooltip.style.left = geom.xPos(index) + "px";
      tooltip.style.top  = geom.yPos(v) + "px";
      tooltip.hidden = false;
    }

    canvas.addEventListener("mousemove", (e) => {
      if(!geom) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      let nearest = 0, minDist = Infinity;
      data.forEach((_, i) => {
        const d = Math.abs(geom.xPos(i) - mx);
        if(d < minDist){ minDist = d; nearest = i; }
      });
      hoverIndex = nearest;
      draw();
    });

    canvas.addEventListener("mouseleave", () => {
      hoverIndex = null;
      draw();
    });

    new ResizeObserver(resize).observe(wrap);
    window.addEventListener("orientationchange", resize);

    return {
      setMonth(monthIndex){
        currentMonth = monthIndex;
        data = monthData(monthIndex);
        hoverIndex = null;
        draw();
      },
      redraw: resize
    };
  })();

  createDropdown(document.getElementById("salesMonthDropdown"), {
    options: MONTHS,
    initial: "October",
    onSelect(month){ salesChart.setMonth(MONTHS.indexOf(month)); }
  });


  const AVATAR_COLORS = ["#5b6df6","#7c6bf0","#22c55e","#f2b90c","#ef7d4f","#f24c6a","#2dd4bf","#a855f7"];

  const DEALS = [
    { product:"Apple Watch Series 9",   location:"6096 Marjolaine Landing, Austin",  date:"2026-09-12", time:"12:53 PM", piece:423, amount:34295, status:"Delivered" },
    { product:"Sony WH-1000XM5",        location:"2847 Ridgewood Ave, Austin",       date:"2026-09-18", time:"09:20 AM", piece:198, amount:21870, status:"Pending" },
    { product:"MacBook Air M3",         location:"120 Baker Street, London",         date:"2026-08-05", time:"03:41 PM", piece:76,  amount:98040, status:"Delivered" },
    { product:"Samsung Galaxy Buds3",   location:"14 Rue de Rivoli, Paris",          date:"2026-09-02", time:"11:05 AM", piece:512, amount:15360, status:"Cancelled" },
    { product:"Dell XPS 15",            location:"88 Collins St, Melbourne",         date:"2026-10-01", time:"06:12 PM", piece:64,  amount:57600, status:"Processing" },
    { product:"iPad Pro 12.9\"",        location:"9 Marina Blvd, Singapore",         date:"2026-09-27", time:"01:30 PM", piece:301, amount:60200, status:"Delivered" },
    { product:"GoPro Hero 13",          location:"305 King St W, Toronto",           date:"2026-09-15", time:"10:45 AM", piece:245, amount:22050, status:"Pending" },
    { product:"Bose SoundLink Flex",    location:"77 Nevsky Ave, St. Petersburg",    date:"2026-08-22", time:"04:55 PM", piece:410, amount:16400, status:"Delivered" },
    { product:"Nikon Z6 III",           location:"1-1 Shibuya, Tokyo",               date:"2026-09-30", time:"02:10 PM", piece:38,  amount:79800, status:"Cancelled" },
    { product:"Kindle Paperwhite",      location:"25 Tverskaya St, Moscow",          date:"2026-10-08", time:"08:00 AM", piece:600, amount:18000, status:"Processing" }
  ].map((d, i) => ({
    ...d,
    id: i + 1,
    initials: d.product.split(" ").slice(0,2).map(w => w[0]).join("").toUpperCase(),
    color: AVATAR_COLORS[i % AVATAR_COLORS.length],
    monthIndex: new Date(d.date + "T00:00:00").getMonth(),
    dateLabel: (() => {
      const [y,m,dd] = d.date.split("-");
      return `${dd}.${m}.${y}`;
    })()
  }));

  const STATUS_CLASS = {
    Delivered:  "ds-badge--delivered",
    Pending:    "ds-badge--pending",
    Cancelled:  "ds-badge--cancelled",
    Processing: "ds-badge--processing"
  };

  const state = {
    search: "",
    status: "All Status",
    month: "All Months",
    sortKey: "date",
    sortDir: "desc",
    page: 1,
    pageSize: 5
  };

  function applyPipeline(){
    let rows = DEALS.filter(d => {
      const q = state.search.trim().toLowerCase();
      const matchesSearch = !q || d.product.toLowerCase().includes(q) || d.location.toLowerCase().includes(q);
      const matchesStatus = state.status === "All Status" || d.status === state.status;
      const matchesMonth  = state.month === "All Months" || MONTHS[d.monthIndex] === state.month;
      return matchesSearch && matchesStatus && matchesMonth;
    });

    const dir = state.sortDir === "asc" ? 1 : -1;
    rows.sort((a, b) => {
      switch(state.sortKey){
        case "product":  return a.product.localeCompare(b.product) * dir;
        case "location": return a.location.localeCompare(b.location) * dir;
        case "piece":    return (a.piece - b.piece) * dir;
        case "amount":   return (a.amount - b.amount) * dir;
        case "status":   return a.status.localeCompare(b.status) * dir;
        case "datetime":
        default:         return (new Date(a.date + " " + a.time) - new Date(b.date + " " + b.time)) * dir;
      }
    });

    return rows;
  }

  function renderDeals(){
    const rows = applyPipeline();
    const totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
    state.page = Math.min(state.page, totalPages);
    const start = (state.page - 1) * state.pageSize;
    const pageRows = rows.slice(start, start + state.pageSize);

    const body = document.getElementById("dealsBody");
    const empty = document.getElementById("dealsEmpty");

    if(pageRows.length === 0){
      body.innerHTML = "";
      empty.hidden = false;
    } else {
      empty.hidden = true;
      body.innerHTML = pageRows.map(d => `
        <tr>
          <td>
            <div class="ds-product-cell">
              <div class="ds-avatar" style="background:${d.color}">${d.initials}</div>
              <span class="ds-product-name">${d.product}</span>
            </div>
          </td>
          <td>${d.location}</td>
          <td>${d.dateLabel} - ${d.time}</td>
          <td>${d.piece}</td>
          <td>$${d.amount.toLocaleString("en-US")}</td>
          <td><span class="ds-badge ${STATUS_CLASS[d.status]}">${d.status}</span></td>
        </tr>
      `).join("");
    }

   
    document.querySelectorAll(".ds-table thead th").forEach(th => {
      const key = th.dataset.sort;
      th.removeAttribute("aria-sort");
      if(key === state.sortKey){
        th.setAttribute("aria-sort", state.sortDir === "asc" ? "ascending" : "descending");
      }
    });

   
    const info = document.getElementById("dealsInfo");
    info.textContent = rows.length === 0
      ? "0 записей"
      : `Показано ${start + 1}–${Math.min(start + state.pageSize, rows.length)} из ${rows.length}`;

    const controls = document.getElementById("dealsPageControls");
    let html = `<button class="ds-page-btn" id="dsPrev" ${state.page === 1 ? "disabled" : ""} aria-label="Предыдущая страница">${ICONS.chevLeft}</button>`;
    for(let p = 1; p <= totalPages; p++){
      html += `<button class="ds-page-btn ${p === state.page ? "is-active" : ""}" data-page="${p}">${p}</button>`;
    }
    html += `<button class="ds-page-btn" id="dsNext" ${state.page === totalPages ? "disabled" : ""} aria-label="Следующая страница">${ICONS.chevRight}</button>`;
    controls.innerHTML = html;

    controls.querySelectorAll("[data-page]").forEach(btn => {
      btn.addEventListener("click", () => { state.page = Number(btn.dataset.page); renderDeals(); });
    });
    const prevBtn = document.getElementById("dsPrev");
    const nextBtn = document.getElementById("dsNext");
    if(prevBtn) prevBtn.addEventListener("click", () => { state.page = Math.max(1, state.page - 1); renderDeals(); });
    if(nextBtn) nextBtn.addEventListener("click", () => { state.page = Math.min(totalPages, state.page + 1); renderDeals(); });
  }

  document.getElementById("dealsSearch").addEventListener("input", (e) => {
    state.search = e.target.value;
    state.page = 1;
    renderDeals();
  });

 
  createDropdown(document.getElementById("statusDropdown"), {
    options: ["All Status","Delivered","Pending","Cancelled","Processing"],
    initial: "All Status",
    onSelect(v){ state.status = v; state.page = 1; renderDeals(); }
  });

  
  createDropdown(document.getElementById("dealsMonthDropdown"), {
    options: ["All Months", ...MONTHS],
    initial: "All Months",
    onSelect(v){ state.month = v; state.page = 1; renderDeals(); }
  });


  document.querySelectorAll(".ds-table thead th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.sort;
      if(state.sortKey === key){
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortKey = key;
        state.sortDir = "asc";
      }
      renderDeals();
    });
  });

  renderStats();
  renderDeals();

  window.DashStackContent = {
    redrawChart: () => salesChart.redraw()
  };
})();
</script>
</body>
